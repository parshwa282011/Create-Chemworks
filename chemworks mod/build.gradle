plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

version = mod_version
group = mod_group_id

base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// Opt-in large heap for stress-testing the generated chemistry catalogue.
// Usage: ./gradlew runServer -Ptest-masive
// The correctly-spelled alias is accepted as well.
def massiveChemistryTest = providers.gradleProperty('test-masive').isPresent() ||
        providers.gradleProperty('test-massive').isPresent()

repositories {
    mavenLocal()
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://maven.ithundxr.dev/snapshots' }
    maven { url = 'https://maven.blamejared.com' }
    maven { url = 'https://maven.theillusivec4.top/' }
    maven { url = 'https://api.modrinth.com/maven' }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '**/*.bbmodel'
    exclude 'src/generated/**/.cache'
}

neoForge {
    version = project.neo_version
    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }
    runs {
        clientParshwa {
            client()
            devLogin = true
            gameDirectory = project.file('run-parshwa')
            programArguments.addAll '--launch_profile', 'parshwa'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        clientHurshy {
            client()
            devLogin = true
            gameDirectory = project.file('run-hurshy')
            programArguments.addAll '--launch_profile', 'hurshy'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        clientAdvait {
            client()
            devLogin = true
            gameDirectory = project.file('run-advait')
            programArguments.addAll '--launch_profile', 'advait'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        clientMilet {
            client()
            devLogin = true
            gameDirectory = project.file('run-milit')
            programArguments.addAll '--launch_profile', 'milit'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            gameDirectory = project.file('run-server')
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        data {
            data()
            gameDirectory = project.file('run-data')
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources').absolutePath, '--existing', file('src/main/resources').absolutePath
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
            if (massiveChemistryTest) {
                jvmArgument '-Xms2G'
                jvmArgument '-Xmx12G'
                systemProperty 'createchemworks.massiveTest', 'true'
            }
        }
    }
    mods {
        "${mod_id}" { sourceSet sourceSets.main }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
    testCompileClasspath.extendsFrom compileClasspath
    testRuntimeClasspath.extendsFrom runtimeClasspath
}

dependencies {
    // Required API and runtime dependency for this mod.
    implementation "com.simibubi.create:create-${minecraft_version}:${create_version}"
    implementation "se.mickelus.mutil:mutil:${mutil_version}"
    implementation "se.mickelus.tetra:tetra:${tetra_version}"
    implementation "maven.modrinth:create-new-age:${create_new_age_version}"

    // Create: Chemworks is a Cosmonautics addon. These pinned runtime artifacts
    // make every Gradle client/server run resolve Cosmonautics and its required
    // Aeronautics + Sable physics stack automatically.
    localRuntime "maven.modrinth:create-cosmonatics:${cosmonautics_version}"
    localRuntime "maven.modrinth:create-aeronautics:${aeronautics_version}"
    localRuntime "maven.modrinth:sable:${sable_version}"

    // Optional integration: compile against JEI APIs and load full JEI while developing.
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    // Client development conveniences. localRuntime keeps these out of the published POM.
    localRuntime "maven.modrinth:e4mc:${e4mc_version}"
    localRuntime "maven.modrinth:sodium:${sodium_version}"
    localRuntime "maven.modrinth:ferrite-core:${ferritecore_version}"
    localRuntime "maven.modrinth:modernfix:${modernfix_version}"
    localRuntime "maven.modrinth:mouse-tweaks:${mouse_tweaks_version}"
    localRuntime "maven.modrinth:jade:${jade_version}"
    localRuntime "maven.modrinth:appleskin:${appleskin_version}"
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test).configure { useJUnitPlatform() }

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
        minecraft_version: minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version: neo_version,
        loader_version_range: loader_version_range,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_license: mod_license,
        mod_version: mod_version,
        create_version: create_version,
        mutil_version: mutil_version,
        tetra_version: tetra_version,
        create_new_age_version: create_new_age_version
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea.module {
    downloadSources = true
    downloadJavadoc = true
}
